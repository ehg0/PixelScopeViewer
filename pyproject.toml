[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["custom_loaders", "sample"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D"]
ignore = [
    # 不要な docstring は書かない方針のため、docstring 欠落は許容する
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # 日本語の summary は「。」で終わるため
    "D415",
    # 日本語の summary は dtype などの英語の用語から始まることがあるため
    "D403",
]

[tool.ruff.lint.flake8-bugbear]
# Qt model の rowCount(parent=QModelIndex()) などの慣用句を許容する
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.ruff.lint.pydocstyle]
convention = "google"
